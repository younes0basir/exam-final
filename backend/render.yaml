services:
  - type: web
    name: upf-university-backend
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/user
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: "UPF University"
      - key: APP_URL
        value: "https://upf-manage.onrender.com"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: switchback.proxy.rlwy.net
      - key: DB_PORT
        value: "26711"
      - key: DB_DATABASE
        value: railway
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        sync: false  # You MUST set this manually in Render dashboard
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: local
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://upf-manage.onrender.com"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "localhost:3000,localhost:5173,upf-manage.onrender.com"
      - key: SESSION_DOMAIN
        value: ".onrender.com"
